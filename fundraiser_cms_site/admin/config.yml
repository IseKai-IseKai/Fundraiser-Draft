
backend:
  name: github
  repo: yourname/yourrepo
  branch: main
media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "content"
        label: "Main Content"
        file: "content.json"
        fields:
          - {label: "Site Title", name: "site_title", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Hero Title", name: "hero_title", widget: "string"}
          - {label: "Hero Text", name: "hero_text", widget: "text"}
          - {label: "Hero Image", name: "hero_image", widget: "image"}
          - {label: "About Text", name: "about_text", widget: "text"}
          - {label: "Goal Text", name: "goal_text", widget: "text"}
          - {label: "Donate Text", name: "donate_text", widget: "text"}
          - {label: "Donate Link", name: "donate_link", widget: "string"}
          - {label: "Contact Text", name: "contact_text", widget: "text"}
          - label: "Gallery"
            name: "gallery"
            widget: list
            fields:
              - {label: "Image", name: "image", widget: image}
